<div id="berg-year-mock" aria-label="Bergschein – schematische Jahresauswahl">
<style>
#berg-year-mock {font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:light-dark(#183e30,#e5f2e9);max-width:370px;margin:0 auto;}
#berg-year-mock * {box-sizing:border-box;}
#berg-year-mock .phone {background:light-dark(#f1f5ee,#17271f);border:1px solid light-dark(#c5d4c8,#425849);border-radius:28px;overflow:hidden;}
#berg-year-mock .top {padding:24px 22px 12px;}
#berg-year-mock .heading {font-size:26px;font-weight:600;margin-bottom:12px;}
#berg-year-mock button {font:inherit;cursor:pointer;color:inherit;}
#berg-year-mock .picker {position:relative;}
#berg-year-mock .trigger {display:flex;align-items:center;gap:9px;border:0;border-radius:12px;background:light-dark(#dfe9df,#2b4133);padding:12px 15px;font-weight:500;min-height:44px;}
#berg-year-mock .menu {position:absolute;top:51px;left:0;width:200px;z-index:3;background:light-dark(#fff,#2b3c31);border:1px solid light-dark(#c5d4c8,#526657);border-radius:12px;box-shadow:0 8px 24px light-dark(#183e3026,#00000055);padding:5px;}
#berg-year-mock .menu button {display:flex;justify-content:space-between;width:100%;padding:12px;border:0;background:transparent;text-align:left;min-height:44px;border-radius:8px;}
#berg-year-mock .menu button[aria-pressed=true] {background:light-dark(#e4eee3,#3c5543);}
#berg-year-mock .segments {display:flex;gap:5px;background:light-dark(#dfe9df,#2b4133);padding:4px;border-radius:12px;}
#berg-year-mock .segments button {flex:1;border:0;border-radius:9px;min-height:44px;background:transparent;}
#berg-year-mock .segments button[aria-pressed=true] {background:light-dark(#fff,#4b6253);}
#berg-year-mock [hidden] {display:none!important;}
#berg-year-mock .content {padding:10px 22px 25px;}
#berg-year-mock .summary {margin:6px 0 18px;font-size:14px;}
#berg-year-mock .stamps {display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;}
#berg-year-mock .stamp {text-align:center;font-size:12px;}
#berg-year-mock .circle {width:62px;height:62px;margin:0 auto 7px;border-radius:50%;border:2px dashed light-dark(#9daf9f,#758b7b);display:grid;place-items:center;color:light-dark(#637c68,#acbeb1);font-size:22px;}
#berg-year-mock .earned .circle {border:2px solid light-dark(#376347,#82ae8f);background:light-dark(#d2e4cf,#35513e);color:light-dark(#234b31,#e5f2e9);}
#berg-year-mock .legend {font-size:12px;min-height:18px;margin-top:20px;color:light-dark(#526859,#afc2b4);}
#berg-year-mock .bottom {display:flex;justify-content:space-around;padding:14px 4px 18px;border-top:1px solid light-dark(#cad8cc,#405548);background:light-dark(#fff,#203228);font-size:11px;gap:3px;}
#berg-year-mock .navitem {display:flex;flex-direction:column;align-items:center;gap:5px;opacity:.65;}
#berg-year-mock .navitem.active {opacity:1;font-weight:600;}
#berg-year-mock .navitem svg {width:20px;height:20px;}
</style>
<div class="phone">
<div class="top"><div class="heading">Bergschein</div>
<div class="picker">
<button class="trigger" type="button" aria-expanded="false" aria-controls="berg-years"><span class="chosen">2027</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
<div class="menu" id="berg-years" aria-label="Jahr auswählen" hidden><button type="button" data-year="2027" aria-pressed="true">2027 <span>✓</span></button><button type="button" data-year="2026" aria-pressed="false">2026 <span></span></button></div>
</div>
<div class="segments" aria-label="Jahr auswählen" hidden><button type="button" data-year="2027" aria-pressed="true">2027</button><button type="button" data-year="2026" aria-pressed="false">2026</button></div>
</div>
<div class="content" aria-live="polite"><div class="summary">0 von 12 Stempeln</div><div class="stamps"></div><div class="legend">Schematische Vorschau · noch keine Stempel</div></div>
<div class="bottom" aria-label="App-Navigation"><div class="navitem"><i data-lucide="map-pin" aria-hidden="true"></i>Check-in</div><div class="navitem active"><i data-lucide="stamp" aria-hidden="true"></i>Bergschein</div><div class="navitem"><i data-lucide="flag" aria-hidden="true"></i>Challenges</div><div class="navitem"><i data-lucide="users" aria-hidden="true"></i>Community</div></div>
</div>
<script>
(() => {
const root=document.getElementById('berg-year-mock');
const state={year:'2027',style:'Menü'};
const menu=root.querySelector('.menu');
const trigger=root.querySelector('.trigger');
const dates={'2027':['13.05.','14.05.','15.05.','16.05.','17.05.','18.05.','19.05.','20.05.','21.05.','22.05.','23.05.','24.05.'],'2026':['21.05.','22.05.','23.05.','24.05.','25.05.','26.05.','27.05.','28.05.','29.05.','30.05.','31.05.','01.06.']};
const collected=new Set([0,1,3,4,7,9,11]);
function render(){
root.querySelector('.picker').hidden=state.style!=='Menü';
root.querySelector('.segments').hidden=state.style==='Menü';
root.querySelector('.chosen').textContent=state.year;
root.querySelector('.summary').textContent=(state.year==='2027'?'0':'7')+' von 12 Stempeln';
root.querySelector('.legend').textContent=state.year==='2027'?'Schematische Vorschau · noch keine Stempel':'Beispiel für 2026 · keine echten Nutzerdaten';
root.querySelector('.stamps').innerHTML=dates[state.year].map((d,i)=>{const earned=state.year==='2026'&&collected.has(i);return '<div class="stamp '+(earned?'earned':'')+'" aria-label="'+d+' '+(earned?'erreicht':'nicht erreicht')+'"><div class="circle">'+(earned?'✓':'·')+'</div>'+d+'</div>';}).join('');
root.querySelectorAll('[data-year]').forEach(b=>{const chosen=b.dataset.year===state.year;b.setAttribute('aria-pressed',String(chosen));const tick=b.querySelector('span');if(tick)tick.textContent=chosen?'✓':'';});
}
trigger.addEventListener('click',()=>{menu.hidden=!menu.hidden;trigger.setAttribute('aria-expanded',String(!menu.hidden));});
root.querySelectorAll('[data-year]').forEach(b=>b.addEventListener('click',()=>{state.year=b.dataset.year;menu.hidden=true;trigger.setAttribute('aria-expanded','false');render();}));
root.addEventListener('keydown',e=>{if(e.key==='Escape'){menu.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'style',{label:'Jahresauswahl',options:['Menü','Sichtbare Reiter']});}
})();
</script>
</div>
